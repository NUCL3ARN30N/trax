[package]
name = "trax"
version = "0.3.0"
edition = "2024"
authors = ["NUCL3ARN30N"]
description = "Material Design music player for local, Nextcloud, YouTube and SoundCloud music"
license = "GPL-3.0-only"
repository = "https://github.com/NUCL3ARN30N/trax"
publish = false

[dependencies]
anyhow = "1.0.104"
async-trait = "0.1.92"
base64 = "0.23.1"
chacha20poly1305 = "0.11.0"
chrono = "0.4.45"
dark-light = "3.0.0"
data-encoding = "2.11.1"
directories = "6.0.0"
env_logger = "0.11.11"
flate2 = "1.1.10"
futures-util = "0.3.34"
hkdf = "0.13.0"
hmac = "0.13.0"
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png"] }
lofty = "0.25.4"
log = "0.4.34"
md-5 = "0.10.6"
nostr = { version = "0.45.5", features = ["os-rng", "nip44", "nip59"] }
percent-encoding = "2.3.2"
pitch_shift = "2.1.0"
rand = "0.10.3"
raw-window-handle = "0.6"
rcgen = { version = "0.14", default-features = false }
reqwest = { version = "0.13.5", default-features = false, features = ["blocking", "rustls", "json", "query", "form"] }
rfd = "0.17.2"
rodio = "0.23.0"
roxmltree = "0.21.1"
rusqlite = { version = "0.40.2", features = ["bundled"] }
rustfft = "6.4.1"
rustls = { version = "0.23", default-features = false, features = ["aws_lc_rs"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha1 = "0.11.0"
sha2 = "0.11.1"
slint = { version = "1.18.1", features = ["raw-window-handle-06", "unstable-winit-030"] }
souvlaki = "0.8.3"
tokio = { version = "1.53.3", features = ["rt-multi-thread", "macros", "sync", "time", "net"] }
tokio-tungstenite = { version = "0.30.0", features = ["rustls-tls-webpki-roots"] }
tray-icon = "0.26.1"
uuid = { version = "1.28.0", features = ["v4"] }
walkdir = "2.5.0"
webrtc = "0.21.1"
zip = "9.0.5"

[build-dependencies]
slint-build = "1.18.1"

[target."cfg(windows)".build-dependencies]
winresource = "0.1.34"

[target."cfg(windows)".dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Graphics_Dwm", "Win32_Graphics_Gdi", "Win32_Foundation", "Win32_UI_Shell"] }
winreg = "0.56.0"
