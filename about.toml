# cargo-about: licenses of everything compiled into trax.exe.
# Regenerate THIRD_PARTY_LICENSES.txt with:
#   cargo about generate --output-file THIRD_PARTY_LICENSES.txt about.hbs
targets = ["x86_64-pc-windows-msvc"]
ignore-build-dependencies = true
ignore-dev-dependencies = true
# Order matters where a crate offers a choice: Slint is used under GPL-3.0, like trax itself.
accepted = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "0BSD",
    "MIT-0",
    "BSL-1.0",
    "Unicode-3.0",
    "CC0-1.0",
    "Unlicense",
    "CDLA-Permissive-2.0",
    "bzip2-1.0.6",
    "OpenSSL",
    "MPL-2.0",
    "GPL-3.0-only",
]
