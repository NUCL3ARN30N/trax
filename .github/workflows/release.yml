# Builds a release when a version tag is pushed, e.g.:
#   (bump `version` in Cargo.toml to 0.2.0, commit)  git tag v0.2.0 && git push origin v0.2.0
# Publishes the installer, the portable zip and SHA256SUMS.txt, which trax's updater needs.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Check tag matches Cargo.toml
        id: version
        shell: pwsh
        run: |
          $version = (Select-String -Path Cargo.toml -Pattern '^version = "(.+)"' | Select-Object -First 1).Matches[0].Groups[1].Value
          $tag = "${{ github.ref_name }}".TrimStart('v')
          if ($tag -ne $version) { throw "Tag v$tag doesn't match Cargo.toml version $version" }
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Test
        run: cargo test --release

      - name: Build
        run: cargo build --release

      - name: Third-party licenses
        # Regenerated for the exact dependencies of this release.
        run: |
          cargo install cargo-about --locked --features cli
          cargo about generate --output-file THIRD_PARTY_LICENSES.txt about.hbs

      - name: Installer
        shell: pwsh
        run: |
          if (-not (Get-Command iscc -ErrorAction SilentlyContinue)) {
            $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
            if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress }
            $env:PATH += ";${env:ProgramFiles(x86)}\Inno Setup 6"
          }
          iscc /DAppVersion=${{ steps.version.outputs.version }} installer\trax.iss

      - name: Portable zip and checksums
        shell: pwsh
        run: |
          $v = "${{ steps.version.outputs.version }}"
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item "target\installer\trax-setup-$v.exe" dist\
          Compress-Archive -Path target\release\trax.exe, README.md, LICENSE, THIRD_PARTY_LICENSES.txt -DestinationPath "dist\trax-$v-portable.zip"
          Get-ChildItem dist | ForEach-Object {
            "$((Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower())  $($_.Name)"
          } | Set-Content -Encoding ascii dist\SHA256SUMS.txt
          Get-Content dist\SHA256SUMS.txt

      - name: Publish release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" dist\* --title "trax ${{ steps.version.outputs.version }}" --generate-notes
